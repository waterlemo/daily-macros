<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f5f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="一日三量">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https:; img-src 'self' data:; base-uri 'none'; object-src 'none'">
  <title>一日三量 · 饮食记录</title>
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=weight-layout1">
  <script type="module" src="./app.mjs?v=health1"></script>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="#intake" aria-label="一日三量首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        一日三量
      </a>
        <aside class="app-sidebar">
    <nav aria-label="记录分区">
      <a id="nav-intake" href="#intake" aria-current="page">饮食</a>
      <a id="nav-weight" href="#weight">体重</a>
    </nav>
  </aside>
      <div class="preferences"><label class="theme"><span>配色</span><select id="tone" aria-label="界面配色"><option value="sky">晴空蓝</option><option value="grape">葡萄紫</option><option value="lagoon">礁湖青</option><option value="berry">莓果红</option></select></label>
      <div class="auth">
        <span id="account-label" class="muted" hidden></span>
        <button id="login" class="button secondary" type="button">口令登录</button>
        <button id="logout" class="button secondary" type="button" hidden>退出</button>
      </div>
      </div>
    </div>
  </header>
  <div class="shell app-layout">

  <main>
    <div class="notice" id="guest">
      <p id="guest-copy">登录后可查看你的私有记录，并在不同设备上继续记。</p>
      <button type="button" id="preview" class="text-button">在本机试用</button>
    </div>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <div id="intake-view">
    <section class="welcome" aria-labelledby="day-title">
      <div>
        <p id="date-label" class="date-label"></p>
        <h1 id="day-title">今日摄入</h1>
      </div>
      <div class="date-actions" id="date-actions" hidden>
        <button class="button quiet" type="button" id="today">回到今天</button>
        <input id="day" type="date" aria-label="查看日期">
      </div>
    </section>
    <section class="card summary" aria-labelledby="summary-title">
      <div class="section-head">
        <h2 id="summary-title">营养摘要</h2>
        <button type="button" id="goals-button" class="button secondary" disabled>管理目标</button>
      </div>
      <form id="day-goal-form" class="day-goal-form" hidden>
        <label for="day-goal-choice" id="day-goal-label">今日目标</label>
        <select id="day-goal-choice"></select>
        <button type="submit" id="apply-goal" class="button secondary">应用</button>
      </form>
      <div class="ledger-head"><span>营养素</span><span>摄入 / 目标</span><span>剩余（克）</span></div><div id="summary" class="summary-grid"></div>
    </section>
    <div class="content-grid">
      <section class="card calculator" aria-labelledby="calc-title">
        <div class="section-head">
          <div>
            <h2 id="calc-title">添加摄入</h2>
            <p class="muted" id="calc-help">输入这次实际摄入的克数。</p>
          </div>
          <button class="text-button" id="reset-food" type="button">清空</button>
        </div>

        <div class="segmented" role="group" aria-label="输入方式">
          <button type="button" id="direct" aria-pressed="true">直接填写</button>
          <button type="button" id="per100" aria-pressed="false">每 100 克换算</button>
        </div>
        <form id="intake-form">
          <fieldset>
            <legend id="amount-legend">每 100 克含量</legend>
            <div id="intake-fields" class="nutrient-fields"></div>
          </fieldset>
          <div class="food-fields">
            <label>食物名称 <small>选填</small>
              <input id="food-name" maxlength="60" placeholder="如无糖酸奶" autocomplete="off">
            </label>
            <label id="portion-field">实际吃了多少 <small>克</small>
              <input id="portion" type="number" inputmode="decimal" min="0.01" max="10000" step="0.01" placeholder="如 60">
            </label>
          </div>

          <div class="result" id="result">
            <span class="result-label" id="result-label">换算结果</span>
            <div id="calculated" class="result-values" aria-live="polite"></div>
          </div>
        <details id="favorites-panel" aria-labelledby="favorites-title" aria-describedby="favorites-hint">
          <summary id="favorites-title">选择常用食物</summary>
          <p id="favorites-hint" class="muted">选一个食物即可带入表单。按每 100 克保存的食物还需填份量。</p>
          <div id="favorites"></div>
        </details>
          <div class="form-actions">
            <button type="submit" id="add" class="button primary" disabled>记入今天</button>
            <button type="button" id="save-food" class="button secondary" disabled>存为常用</button>
          </div>
          <p id="form-note" class="muted note">只想临时算一下，直接看换算结果即可。</p>
        </form>
      </section>
      <div class="side">
        <section class="card" aria-labelledby="records-title">
          <div class="section-head">
            <h2 id="records-title">今日记录</h2>
            <span id="record-count" class="count" hidden></span>
          </div>
          <div id="records"></div>
        </section>
      </div>
    </div>
    </div>
    <div id="weight-view" hidden>
      <section class="welcome" aria-labelledby="weight-title">
        <h1 id="weight-title">体重记录</h1>
        <button id="weight-today" class="button quiet" type="button" hidden>回到今天</button>
      </section>
      <section class="card" aria-labelledby="weight-entry-title">
        <h2 id="weight-entry-title">记录体重</h2>
        <form id="weight-form">
          <label class="weight-field" for="weight-date">
            <span>日期</span>
            <span class="weight-control"><input id="weight-date" type="date" required disabled></span>
          </label>
          <label class="weight-field" for="weight-amount">
            <span>体重</span>
            <span class="weight-control"><input id="weight-amount" type="number" inputmode="decimal" min="0.1" max="1000" step="0.01" placeholder="如 72.50" aria-describedby="weight-unit" required disabled><span id="weight-unit">kg</span></span>
          </label>
          <button id="weight-save" class="button primary" type="submit" disabled>保存</button>
        </form>
        <p id="weight-status" role="status" hidden></p>
      </section>
      <section class="card weight-trend" aria-labelledby="weight-trend-title">
        <div class="section-head">
          <h2 id="weight-trend-title">体重趋势</h2>
          <div id="weight-period" class="weight-period" role="group" aria-label="趋势时间范围">
            <button type="button" data-days="7" aria-pressed="true">7 日</button>
            <button type="button" data-days="30" aria-pressed="false">30 日</button>
          </div>
        </div>
        <p id="weight-summary" class="muted"></p>
        <div id="weight-chart-wrap" hidden>
          <canvas id="weight-chart" role="img" aria-label="体重趋势图"></canvas>
        </div>
        <p id="weight-empty" class="muted empty">登录或在本机试用后，可以记录体重。</p>
        <ul id="weight-list" class="weight-list" aria-label="区间内的体重记录"></ul>
      </section>
    </div>
  </main>
  </div>
  <dialog id="login-dialog" aria-labelledby="login-title">
    <form id="login-form">
      <div class="section-head">
        <h2 id="login-title">口令登录</h2>
        <button id="close-login" type="button" class="text-button">关闭</button>
      </div>
      <label class="passphrase-field">个人口令
        <input id="passphrase" type="password" maxlength="128" autocomplete="current-password" required autofocus>
      </label>
      <p id="login-status" role="status" hidden></p>
      <button id="submit-login" class="button primary" type="submit">登录</button>
    </form>
  </dialog>
  <dialog id="goals-dialog" aria-labelledby="goals-dialog-title">
    <div class="goal-dialog-content">
      <div class="section-head">
        <h2 id="goals-dialog-title">管理目标</h2>
        <button id="close-goals" type="button" class="text-button">关闭</button>
      </div>
      <p id="goal-status" role="status" hidden></p>
      <div id="goal-overview">
        <div class="item">
          <div class="item-main">
            <strong>默认目标</strong>
            <p id="goal-default-summary" class="muted"></p>
          </div>
          <button id="edit-default-goal" type="button" class="text-button" aria-label="编辑默认目标">编辑</button>
          <button id="delete-default-goal" type="button" class="text-button" aria-label="删除默认目标" hidden>删除</button>
        </div>
        <div class="section-head goal-profiles-heading">
          <h3>目标方案</h3>
          <button id="add-goal-profile" type="button" class="button secondary">新增方案</button>
        </div>
        <div id="goal-profiles"></div>
      </div>
      <form id="goals-form" hidden>
        <h3 id="goal-editor-title"></h3>
        <label id="goal-name-field">方案名称
          <input id="goal-name" type="text" maxlength="40" placeholder="如训练日" required>
        </label>
        <div id="goal-fields" class="nutrient-fields"></div>
        <div class="form-actions">
          <button id="save-goal" class="button primary" type="submit">保存</button>
          <button id="cancel-goal" class="button quiet" type="button">取消</button>
        </div>
      </form>
    </div>
  </dialog>
</body>
</html>
